name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Every day at 06:00 UTC, to catch changes in the API even when this repo has no new commits.
    - cron: '0 6 * * *'
  # Adds a "Run workflow" button on the Actions tab.
  workflow_dispatch:

# The job only needs to read the code.
permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # API tests only, so there is no browser to download.
      - name: Run API tests
        run: npx playwright test

      # Upload the report even when tests fail, because that is when it is needed most.
      - name: Upload HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
